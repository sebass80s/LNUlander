name: Rune CI

on:
  push:
    branches:
      - main
      - 'sid/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax and flight model
        run: npm run check
      - name: Compile Rune SDK game
        run: npm run build
      - name: Upload bundled JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: lnulander-js
          path: dist/lnulander.js
          if-no-files-found: error
